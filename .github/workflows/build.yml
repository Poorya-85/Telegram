name: Build Custom Telegram

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Write API credentials
        run: |
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${{ secrets.TELEGRAM_API_ID }};/" \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/public static String APP_HASH = .*/public static String APP_HASH = "${{ secrets.TELEGRAM_API_HASH }}";/' \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Setup keystore
        run: |
          KEYSTORE_B64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "✅ Using existing keystore"
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYSTORE_IS_NEW=false" >> $GITHUB_ENV
          else
            echo "⚠️ Generating new keystore..."
            keytool -genkey -v \
              -keystore keystore.jks \
              -alias mytelegram \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mytelegram123 \
              -keypass mytelegram123 \
              -dname "CN=MyTelegram,O=Personal,C=IR"
            echo "KEYSTORE_PASS=mytelegram123" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=mytelegram" >> $GITHUB_ENV
            echo "KEY_PASS=mytelegram123" >> $GITHUB_ENV
            echo "KEYSTORE_IS_NEW=true" >> $GITHUB_ENV
            base64 keystore.jks > keystore_base64.txt
          fi

      - name: Upload keystore (first time only)
        if: env.KEYSTORE_IS_NEW == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-THIS-keystore
          path: |
            keystore.jks
            keystore_base64.txt
          retention-days: 5

      - name: Resize and copy icon
        run: |
          pip install Pillow -q
          python3 - << 'EOF'
          from PIL import Image

          src = "icons/ic_launcher.png"
          img = Image.open(src).convert("RGBA")

          sizes = {
              "mipmap-mdpi":    48,
              "mipmap-hdpi":    72,
              "mipmap-xhdpi":   96,
              "mipmap-xxhdpi":  144,
              "mipmap-xxxhdpi": 192,
          }

          base = "TMessagesProj/src/main/res"
          for folder, size in sizes.items():
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(f"{base}/{folder}/ic_launcher.png", "PNG")
              print(f"✅ {folder}: {size}x{size}")
          EOF

      - name: Apply all customizations
        run: python3 apply_changes.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (arm64 only - afat flavor)
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ env.KEYSTORE_PASS }} \
            -Pandroid.injected.signing.key.alias=${{ env.KEY_ALIAS_VAL }} \
            -Pandroid.injected.signing.key.password=${{ env.KEY_PASS }}
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTelegram-arm64-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          retention-days: 30

      - name: Done
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk/afat/release/ -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "✅ Build #${{ github.run_number }} done!"
            echo "📏 Size: $(du -sh $APK | cut -f1)"
          else
            echo "⚠️ APK not found in expected path, searching..."
            find . -name "*.apk" -path "*/afat/release/*" 2>/dev/null
          fi
